name: Build V Browser APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    name: Build V Browser
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Download Repository
        uses: actions/checkout@v4

      - name: Find and Extract Android ZIP
        shell: bash
        run: |
          set -e

          mkdir -p extracted

          mapfile -t ZIPS < <(
            find . -type f -iname '*.zip' \
            ! -path './.git/*' \
            ! -path './extracted/*' | sort
          )

          if [ ${#ZIPS[@]} -eq 0 ]; then
            echo "::error::Repository mein ZIP nahi mili."
            exit 1
          fi

          FOUND=false

          for ZIP in "${ZIPS[@]}"; do
            echo "Checking $ZIP"

            rm -rf extracted/*
            unzip -q "$ZIP" -d extracted || continue

            SETTINGS=$(find extracted -type f \
              \( -name settings.gradle -o -name settings.gradle.kts \) \
              -print -quit)

            if [ -n "$SETTINGS" ]; then
              ROOT=$(dirname "$SETTINGS")

              if [ -d "$ROOT/app" ]; then
                echo "PROJECT_DIR=$ROOT" >> "$GITHUB_ENV"
                FOUND=true
                break
              fi
            fi
          done

          if [ "$FOUND" != "true" ]; then
            echo "::error::Valid Android project nahi mila."
            exit 1
          fi

          echo "Android project found!"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK and Accept Licenses
        shell: bash
        run: |
          set -e

          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT=$ANDROID_HOME

          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"

          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" \
            -type f -name sdkmanager | sort -V | tail -n 1)

          if [ -z "$SDKMANAGER" ]; then
            echo "::error::SDK Manager nahi mila."
            exit 1
          fi

          echo "Using SDK Manager: $SDKMANAGER"

          echo "Accepting Android SDK licenses..."

          yes | "$SDKMANAGER" --licenses \
            > /tmp/licenses.log 2>&1 || true

          echo "Installing Android SDK packages..."

          yes | "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-34" \
            "platforms;android-35" \
            "platforms;android-36" \
            "build-tools;34.0.0" \
            "build-tools;35.0.0" \
            "build-tools;36.0.0" \
            > /tmp/sdk-install.log 2>&1

          echo "Android SDK installation completed."

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build V Browser APK
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew assembleDebug --no-daemon --console=plain
          else
            gradle assembleDebug --no-daemon --console=plain
          fi

      - name: Find APK
        shell: bash
        run: |
          set -e

          mkdir -p output

          APK=$(find "$PROJECT_DIR/app/build/outputs/apk" \
            -type f -name '*.apk' | head -n 1)

          if [ -z "$APK" ]; then
            echo "::error::APK generate nahi hui."
            exit 1
          fi

          cp "$APK" output/V-Browser.apk

          echo "APK successfully created!"
          ls -lh output/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: V-Browser-APK
          path: output/V-Browser.apk
          if-no-files-found: error
          retention-days: 30
