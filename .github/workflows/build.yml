
name: Build V Browser APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    name: Build V Browser
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Download Repository
        uses: actions/checkout@v4

      - name: Find and Extract Android ZIP
        shell: bash
        run: |
          set -e

          mkdir -p extracted

          mapfile -t ZIPS < <(
            find . -type f -iname '*.zip' \
            ! -path './.git/*' \
            ! -path './extracted/*' | sort
          )

          if [ ${#ZIPS[@]} -eq 0 ]; then
            echo "::error::No ZIP file found."
            exit 1
          fi

          FOUND=false

          for ZIP in "${ZIPS[@]}"; do
            echo "Checking $ZIP"

            rm -rf extracted/*
            unzip -q "$ZIP" -d extracted || continue

            SETTINGS=$(find extracted -type f \
              \( -name settings.gradle -o -name settings.gradle.kts \) \
              -print -quit)

            if [ -n "$SETTINGS" ]; then
              ROOT=$(dirname "$SETTINGS")

              if [ -d "$ROOT/app" ]; then
                echo "PROJECT_DIR=$ROOT" >> "$GITHUB_ENV"
                FOUND=true
                break
              fi
            fi
          done

          if [ "$FOUND" != "true" ]; then
            echo "::error::Android project not found in ZIP."
            exit 1
          fi

          echo "Android project found!"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Licenses and Install SDK
        shell: bash
        run: |
          set -e

          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT=$ANDROID_HOME

          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"

          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -f "$SDKMANAGER" ]; then
            echo "::error::SDK Manager not found."
            exit 1
          fi

          echo "Accepting licenses..."

          set +e
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses \
            > /tmp/licenses.log 2>&1
          LICENSE_STATUS=${PIPESTATUS[1]}
          set -e

          if [ "$LICENSE_STATUS" -ne 0 ]; then
            echo "License command returned $LICENSE_STATUS"
            tail -n 20 /tmp/licenses.log
          fi

          echo "Installing SDK packages..."

          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --install \
            "platform-tools" \
            "platforms;android-34" \
            "platforms;android-35" \
            "platforms;android-36" \
            "build-tools;34.0.0" \
            "build-tools;35.0.0" \
            "build-tools;36.0.0"

          echo "SDK installation completed."

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew assembleDebug --no-daemon --console=plain
          else
            gradle assembleDebug --no-daemon --console=plain
          fi

      - name: Find APK
        shell: bash
        run: |
          set -e

          mkdir -p output

          APK=$(find "$PROJECT_DIR/app/build/outputs/apk" \
            -type f -name '*.apk' | head -n 1)

          if [ -z "$APK" ]; then
            echo "::error::APK not generated."
            exit 1
          fi

          cp "$APK" output/V-Browser.apk

          echo "APK successfully generated!"
          ls -lh output/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: V-Browser-APK
          path: output/V-Browser.apk
          if-no-files-found: error
          retention-days: 30
