
name: Build V Browser APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    name: Build V Browser
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Download Repository
        uses: actions/checkout@v4

      - name: Find and Extract V Browser ZIP
        shell: bash
        run: |
          set -e
          mkdir -p extracted

          mapfile -t ZIPS < <(
            find . -type f -iname '*.zip' \
            ! -path './.git/*' \
            ! -path './extracted/*' | sort
          )

          if [ ${#ZIPS[@]} -eq 0 ]; then
            echo "::error::No ZIP file found."
            exit 1
          fi

          FOUND=false

          for ZIP in "${ZIPS[@]}"; do
            echo "Checking: $ZIP"
            rm -rf extracted/*
            unzip -q "$ZIP" -d extracted || continue

            SETTINGS=$(find extracted -type f \
              \( -name settings.gradle -o -name settings.gradle.kts \) \
              -print -quit)

            if [ -n "$SETTINGS" ]; then
              ROOT=$(dirname "$SETTINGS")

              if [ -d "$ROOT/app" ]; then
                echo "PROJECT_DIR=$ROOT" >> "$GITHUB_ENV"
                FOUND=true
                break
              fi
            fi
          done

          if [ "$FOUND" != "true" ]; then
            echo "::error::Android project not found in ZIP."
            exit 1
          fi

          echo "Project found successfully."

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Android-actions/setup-android intentionally removed.
      # Use the runner's preinstalled Android SDK directly.

      - name: Setup Android SDK
        shell: bash
        run: |
          set -e

          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT=$ANDROID_HOME

          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"

          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" \
            -type f -name sdkmanager | sort -V | tail -n 1)

          if [ -z "$SDKMANAGER" ]; then
            echo "::error::SDK Manager not found."
            exit 1
          fi

          echo "SDK Manager: $SDKMANAGER"

          echo "Accepting SDK licenses..."

          set +e
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses \
            > /tmp/licenses.log 2>&1
          set -e

          echo "Installing Android packages..."

          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --install \
            "platform-tools" \
            "platforms;android-33" \
            "platforms;android-34" \
            "platforms;android-35" \
            "platforms;android-36" \
            "build-tools;34.0.0" \
            "build-tools;35.0.0" \
            "build-tools;36.0.0"

          echo "SDK installation successful."

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build V Browser APK
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"

          echo "Starting APK build..."

          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew assembleDebug --no-daemon --console=plain
          else
            gradle assembleDebug --no-daemon --console=plain
          fi

      - name: Find and Verify APK
        shell: bash
        run: |
          set -e

          mkdir -p output

          APK=$(find "$PROJECT_DIR/app/build/outputs/apk" \
            -type f -name '*.apk' | head -n 1)

          if [ -z "$APK" ]; then
            echo "::error::APK file not found."
            exit 1
          fi

          cp "$APK" output/V-Browser.apk

          echo "APK generated successfully!"
          ls -lh output/V-Browser.apk

      - name: Upload V Browser APK
        uses: actions/upload-artifact@v4
        with:
          name: V-Browser-APK
          path: output/V-Browser.apk
          if-no-files-found: error
          retention-days: 30
