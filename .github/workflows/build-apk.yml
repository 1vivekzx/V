name: Build V Browser APK

# Kaise chalana hai: GitHub -> Actions tab -> "Build V Browser APK" -> Run workflow.
# Ye apne aap nahi chalta; sirf aapke "Run workflow" dabane par chalta hai.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    name: APK banao
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Phone wala tarika - agar dono ZIP upload ki hain to unhe khud jod do
        run: |
          set -e
          if [ -f settings.gradle ] && [ -d app ]; then
            echo "Project pehle se khula hua hai (normal tarika). Is step ki zaroorat nahi."
            exit 0
          fi
          BZ="$(find . -maxdepth 1 -type f -iname '*builder*.zip' | head -n 1)"
          WZ="$(find . -maxdepth 1 -type f -iname '*website*.zip' | head -n 1)"
          if [ -z "$BZ" ]; then
            echo "::error title=Project nahi mila::Repository mein na to khule hue project ki files hain (settings.gradle, app folder), na V-Browser-APK-Builder.zip. README-HINDI.md padho."
            exit 1
          fi
          echo "Builder ZIP: $BZ"
          unzip -q -o "$BZ" -d .
          if [ -n "$WZ" ]; then
            echo "Website ZIP: $WZ"
            mkdir -p website
            unzip -q -o "$WZ" -d website
          fi
          ls -la

      - name: Website ki files check karo
        run: |
          set -e
          SITE_ROOT="$(find . -maxdepth 1 -type d -iname website | head -n 1)"
          if [ -z "$SITE_ROOT" ]; then
            echo "::error title=website folder nahi mila::GitHub repository mein 'website' naam ka folder nahi hai. README-HINDI.md dekho: V-Browser-Website.zip ki files 'website' folder mein daalni hain."
            exit 1
          fi
          IDX="$(find "$SITE_ROOT" -maxdepth 4 -type f -name index.html | awk '{ print length($0) " " $0 }' | sort -n | head -n 1 | cut -d' ' -f2-)"
          if [ -z "$IDX" ]; then
            echo "::error title=index.html nahi mili::'website' folder ke andar index.html nahi hai. V-Browser-Website.zip ko extract karke uski saari files 'website' folder mein upload karo."
            exit 1
          fi
          SITE_DIR="$(cd "$(dirname "$IDX")" && pwd)"
          echo "Website mili: $SITE_DIR"
          ls -la "$SITE_DIR"
          echo "WEBSITE_DIR=$SITE_DIR" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK licenses
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          SDKM="$(command -v sdkmanager || true)"
          [ -n "$SDKM" ] || SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          set +o pipefail
          yes | "$SDKM" --licenses > /tmp/licenses.log 2>&1 || true
          tail -n 3 /tmp/licenses.log
          if ! "$SDKM" --list_installed 2>/dev/null | grep -q "platforms;android-34"; then
            yes | "$SDKM" "platforms;android-34" > /tmp/p34.log 2>&1 || true; tail -n 3 /tmp/p34.log
          fi
          if ! "$SDKM" --list_installed 2>/dev/null | grep -q "build-tools;34"; then
            yes | "$SDKM" "build-tools;34.0.0" > /tmp/bt34.log 2>&1 || true; tail -n 3 /tmp/bt34.log
          fi

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Signing key (agar repository mein nahi hai to nayi bana do)
        run: |
          if [ ! -f keystore/vbrowser-release.jks ]; then
            mkdir -p keystore
            keytool -genkeypair -keystore keystore/vbrowser-release.jks -alias vbrowser -keyalg RSA -keysize 2048 -validity 36500 \
              -storepass vbrowser123 -keypass vbrowser123 -dname "CN=V Browser, O=Vivek, C=IN"
            echo "keystore/vbrowser-release.jks nahi mila, isliye nayi key banayi gayi."
          else
            echo "keystore/vbrowser-release.jks mil gayi."
          fi

      - name: APK build karo
        run: |
          set +e
          gradle assembleRelease -PwebsiteDir="$WEBSITE_DIR" -PversionCode="$GITHUB_RUN_NUMBER" --no-daemon --console=plain > build.log 2>&1
          code=$?
          if [ $code -ne 0 ]; then
            grep -n -E "error:|What went wrong|Execution failed|Could not|Failed to|cannot find symbol|AAPT|Manifest merger|license|WEBSITE NAHI MILI" -A4 build.log | head -n 70 > err.txt || true
            [ -s err.txt ] || tail -n 30 build.log > err.txt
            { echo '### Build fail hui: error ka text'; echo '```'; head -c 6000 err.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
            MSG="$(head -n 30 err.txt | head -c 3500 | sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g')"
            echo "::error title=Build fail hui - ye text bhejo::$MSG"
            echo "=================== ERROR SUMMARY ==================="
            cat err.txt
            echo "================== LOG KI AAKHRI LINES =============="
            tail -n 25 build.log
          else
            tail -n 5 build.log
          fi
          exit $code

      - name: APK ko jaanch kar nikalo
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk out/V-Browser.apk
          ls -la out
          APKSIGNER="$(ls "$ANDROID_HOME"/build-tools/*/apksigner 2>/dev/null | sort | tail -n 1)"
          if [ -n "$APKSIGNER" ]; then "$APKSIGNER" verify --print-certs out/V-Browser.apk | head -n 5 || true; fi
          unzip -l out/V-Browser.apk | grep -E "assets/website/index.html" || { echo "::error::APK ke andar website/index.html nahi mili"; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: V-Browser-APK
          path: out/V-Browser.apk
          retention-days: 30

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore
          retention-days: 7
